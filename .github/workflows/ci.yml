name: C++ CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y cmake g++ lcov

  - name: Configure
    run: |
      mkdir build
      cd build
      cmake ..

  - name: Build
    run: |
      cd build
      make -j

  - name: Run Tests
    run: |
      cd build
      ctest --output-on-failure
```
